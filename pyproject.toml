[project]
name = "ai-img2sketch"
version = "0.1.0"
description = "Convert images to sketch video animations with drawing hand effect"
readme = "README.md"
authors = [{ name = "Sabry Awad", email = "dr.sabry1997@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "click==8.1.8",
    "numpy==2.2.4",
    "opencv-python==4.11.0.86",
    "pydantic==2.11.1",
    "rich==14.0.0",
]

[project.scripts]
img2sketch = "ai_img2sketch.presentation.cli:cli"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long, handled by formatter
    "B008", # do not perform function calls in argument defaults
    "B905", # zip without explicit strict parameter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # unused imports in __init__.py

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
root = ["./src"]
python = ".venv"

[tool.ty.analysis]
respect-type-ignore-comments = true

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.11.2", "ty>=0.0.87"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

