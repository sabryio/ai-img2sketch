# Single service today: sketch generation is CPU-bound and the event bus is
# in-process, so more workers would split the SSE fan-out. Scale by running
# additional stacks behind a load balancer instead.
services:
  api:
    build: .
    image: ai-img2sketch-api
    container_name: ai-img2sketch-api
    # Bound to localhost only — the Tauri webview runs on the same machine.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_LOG_LEVEL: info
      # Nothing is mounted from the host: a client uploads the file it wants
      # processed, downloads the result, and can delete either afterwards. Both
      # directories are tmpfs, so they live in RAM and vanish with the container
      # rather than persisting in an image layer.
      APP_MEDIA_DIR: /app/media
      APP_OUTPUT_DIR: /app/output
      APP_CORS_ORIGINS: >
        ["http://localhost:1420", "http://localhost:3000", "http://127.0.0.1:3000", "http://tauri.localhost", "tauri://localhost"]
    tmpfs:
      # Scratch space for uploads and rendered videos. Sized so a runaway batch
      # cannot eat the host's memory, and wiped whenever the container restarts.
      # A tmpfs mount starts out owned by root, which would leave the image's
      # non-root user (uid 10001, see the Dockerfile) unable to write in it, so
      # both are handed to that user explicitly.
      - /app/media:size=512m,uid=10001,gid=10001,mode=0755
      - /app/output:size=1g,uid=10001,gid=10001,mode=0755
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
